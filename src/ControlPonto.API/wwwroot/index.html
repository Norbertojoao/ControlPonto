<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlPonto — Gestão de Jornada</title>
    <style>
        :root { --primary: #1e3a8a; --accent: #2563eb; --success: #16a34a; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
        .container { max-width: 920px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        h1 { margin: 0; color: var(--primary); font-size: 1.6rem; }
        h3 { margin-top: 0; color: var(--primary); }
        .card { background: var(--card); border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.9rem; font-weight: 600; color: #334155; }
        button { background: var(--accent); color: #fff; border: none; padding: 11px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary); }
        button.btn-register { background: var(--success); }
        button.btn-register:hover { background: #15803d; }
        select, input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 0.95rem; }
        .alert { padding: 12px; border-radius: 6px; margin-top: 12px; display: none; font-weight: 500; }
        .alert.error { background: #fee2e2; color: #991b1b; display: block; }
        .alert.success { background: #dcfce7; color: #166534; display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; color: #334155; }
        .metrics { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
        .metric-box { background: #eff6ff; padding: 12px 18px; border-radius: 8px; border-left: 4px solid var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>⏱️ ControlPonto — Registro Eletrônico</h1>
        <a href="/swagger" target="_blank">Documentação API (Swagger)</a>
    </header>

    <!-- Card 1: Cadastro de Novo Colaborador -->
    <div class="card">
        <h3>👤 Cadastrar Novo Colaborador</h3>
        <form id="employeeForm" onsubmit="createEmployee(event)">
            <div class="form-grid">
                <div class="field">
                    <label for="empName">Nome Completo *</label>
                    <input type="text" id="empName" placeholder="Ex: Maria Oliveira" required maxlength="120">
                </div>
                <div class="field">
                    <label for="empCode">Matrícula *</label>
                    <input type="text" id="empCode" placeholder="Ex: DEV-2027" required maxlength="30">
                </div>
                <div class="field">
                    <label for="empDept">Departamento *</label>
                    <input type="text" id="empDept" placeholder="Ex: Tecnologia" required maxlength="80">
                </div>
                <div class="field">
                    <label for="empWorkload">Carga Diária (horas)</label>
                    <select id="empWorkload">
                        <option value="480" selected>8 horas (480 min)</option>
                        <option value="360">6 horas (360 min)</option>
                        <option value="240">4 horas (240 min)</option>
                    </select>
                </div>
                <div class="field">
                    <button type="submit" class="btn-register">+ Cadastrar</button>
                </div>
            </div>
        </form>
        <div id="employeeFeedback" class="alert"></div>
    </div>

    <!-- Card 2: Registro de Ponto -->
    <div class="card">
        <h3>🕒 Registrar Ponto</h3>
        <div class="field">
            <label for="employeeSelect">Selecione o Colaborador:</label>
            <select id="employeeSelect" onchange="loadSummary()"></select>
        </div>

        <div class="grid">
            <button onclick="registerPunch(1)">1. Registrar Entrada</button>
            <button onclick="registerPunch(2)">2. Saída Intervalo</button>
            <button onclick="registerPunch(3)">3. Retorno Intervalo</button>
            <button onclick="registerPunch(4)">4. Registrar Saída</button>
        </div>
        <div id="feedback" class="alert"></div>
    </div>

    <!-- Card 3: Espelho de Ponto do Dia -->
    <div class="card">
        <h3>📊 Resumo da Jornada de Hoje</h3>
        <div class="metrics">
            <div class="metric-box"><strong>Total Trabalhado:</strong> <span id="workedHours">00:00</span></div>
            <div class="metric-box"><strong>Saldo do Dia:</strong> <span id="balanceHours">+00:00</span></div>
        </div>
        <table>
            <thead>
                <tr><th>Horário</th><th>Tipo de Marcação</th></tr>
            </thead>
            <tbody id="recordsTable"></tbody>
        </table>
    </div>
</div>

<script>
    async function loadEmployees(selectedId = null) {
        const res = await fetch('/api/employees');
        const data = await res.json();
        const select = document.getElementById('employeeSelect');
        select.innerHTML = data.map(e =>
            `<option value="${e.id}">${e.name} (${e.registrationCode}) — ${e.department} [${e.dailyWorkloadMinutes / 60}h/dia]</option>`
        ).join('');

        if (selectedId) {
            select.value = selectedId;
        }
        if (data.length > 0) {
            loadSummary();
        }
    }

    async function createEmployee(event) {
        event.preventDefault();
        const feedback = document.getElementById('employeeFeedback');
        const payload = {
            name: document.getElementById('empName').value,
            registrationCode: document.getElementById('empCode').value,
            department: document.getElementById('empDept').value,
            dailyWorkloadMinutes: parseInt(document.getElementById('empWorkload').value, 10)
        };

        const res = await fetch('/api/employees', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const body = await res.json();
        if (res.ok) {
            feedback.className = 'alert success';
            feedback.textContent = `Colaborador '${body.name}' (Matrícula ${body.registrationCode}) cadastrado com sucesso!`;
            document.getElementById('employeeForm').reset();
            await loadEmployees(body.id);
        } else {
            feedback.className = 'alert error';
            feedback.textContent = body.message || 'Erro ao cadastrar colaborador.';
        }
    }

    async function registerPunch(type) {
        const employeeId = document.getElementById('employeeSelect').value;
        const feedback = document.getElementById('feedback');
        const res = await fetch('/api/timerecords', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ employeeId, type })
        });
        const body = await res.json();
        if (res.ok) {
            feedback.className = 'alert success';
            feedback.textContent = `Marcação '${body.typeDescription}' registrada às ${new Date(body.timestamp).toLocaleTimeString()}!`;
            loadSummary();
        } else {
            feedback.className = 'alert error';
            feedback.textContent = body.message || 'Erro ao registrar ponto.';
        }
    }

    async function loadSummary() {
        const employeeId = document.getElementById('employeeSelect').value;
        if (!employeeId) return;
        const res = await fetch(`/api/timerecords/daily/${employeeId}`);
        if (!res.ok) return;
        const summary = await res.json();
        document.getElementById('workedHours').textContent = summary.workedFormatted;
        document.getElementById('balanceHours').textContent = summary.balanceFormatted;
        const tbody = document.getElementById('recordsTable');
        tbody.innerHTML = summary.records.length > 0
            ? summary.records.map(r => `<tr><td>${new Date(r.timestamp).toLocaleTimeString()}</td><td>${r.typeDescription}</td></tr>`).join('')
            : '<tr><td colspan="2" style="color:#64748b;">Nenhuma marcação registrada hoje.</td></tr>';
    }

    loadEmployees();
</script>
</body>
</html>
